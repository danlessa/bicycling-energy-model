n p < 0.001), mass-robust; hilliest tercile 12.0% → 5.8% while the flattest is unchanged."},{"desc":"","entry":13,"id":"assert13_ev2","kind":"evidence","text":"Predicted descent speeds over-shoot measured (med 38 vs 30, 37 vs 16, 52 vs 32 km/h across the three corpora); the uncapped analytic form diverges near α = ε·β·s̄. Also corrected: the stable r₊ ≈ 1.26 is a near-tautology (the Entry-7 energy over-charge re-expressed), not independent time evidence."},{"desc":"the energy law and the −0.13 offset transfer; the geometric-ε skill is rider-dependent","entry":14,"id":"assert14","kind":"claim","text":"The energy law and the −0.13 offset are consistent a third time (canonical 5.4% med|Δ%| with data-implied mass; smooth ε=0.20 best at 3.5%; offset 0.133, bootstrap CI 0.102–0.186) — but the geometric-ε skill does NOT transfer: it fails outright on JAAM's gentle-heavy bulk and is inconclusive on the thin real-descent subset. The skill works for riders who coast (P. Paz), not for riders who pedal descents (JAAM). Framing corrected: P. Paz and JAAM are independent third-party riders, not Pedal Hidrográfico members; only the censo is a collective corpus."},{"desc":"","entry":14,"id":"assert14_ev1","kind":"evidence","text":"Offset gap 0.133 [0.102, 0.186] matches the calibrated 0.13 and P. Paz's 0.12; energy 3.5–5.4% median on 219 clean rides."},{"desc":"","entry":14,"id":"assert14_ev2","kind":"evidence","text":"Frozen estimator RMS 0.47 vs flat-constant 0.16 on the gentle bulk; on real descents (n = 21) −0.020 RMS difference with CI [−0.072, 0.024] straddling zero — inconclusive."},{"desc":"","entry":15,"id":"assert15","kind":"claim","text":"All four parameters are recoverable within the pre-stated plausible ranges for all three riders: mass from braking-free sustained climbs is CdA-robust (JAAM's implied 103 kg was genuine — rider-confirmed ≈ 100 ± 7 kg, retiring Entry 14's CdA-misspecification guess); CdA and C_rr become identifiable only once per-activity wind is modelled via a LINEARISED aero regression (flat-power, coast-down and climb-only methods all fail for CdA); the wind vector itself comes from GPS-bearing directional asymmetry, de-biased for regression attenuation."},{"desc":"","entry":15,"id":"assert15_ev1","kind":"evidence","text":"P. Paz 80.7 kg / CdA 0.259 / C_rr 0.0053; JAAM 103 / 0.322 / 0.0107; author anchor 79.8 / 0.334 / 0.0083 — all inside target ranges; a synthetic-wind self-test exposed and then passed the CdA↔wind degeneracy."},{"desc":"accuracy robust; the P. Paz 35% ε win demoted to a tie; mass machinery validated","entry":16,"id":"assert16","kind":"claim","text":"The energy law's ~4–7% accuracy is robust to assumed-vs-fitted physics, but P. Paz's 35% ε win does not survive: under best-guess physics both independent riders TIE the geometric estimator against their own best flat constant (JAAM fully robust throughout). The author's full export validates the mass machinery (71–75 kg vs known ≈ 73; the earlier 79.8 was genuine brevet loadout) and the 0.13 offset, in-sample. Fitted CdA clusters at the aero-position value (0.26–0.34), ~35% below the assumed 0.40 — the flat-fit sees the tucked/drafting rider."},{"desc":"","entry":16,"id":"assert16_ev1","kind":"evidence","text":"621 clean rides: canonical 6.1% median at +0.1% bias (the calibration rider, as expected); implied mass 74.5 kg [67.6–80.8]; offset gap 0.13 recurs."},{"desc":"","entry":16,"id":"assert16_ev2","kind":"evidence","text":"With fitted physics P. Paz's frozen-ε RMS advantage collapses 0.091-vs-0.139 → 0.083-vs-0.086 (tie), and the canonical bias flips +5.0 → −6.9%."},{"desc":"rejected alternative","entry":17,"id":"assert17","kind":"claim","text":"Regime decomposition does not beat the champion: its win/loss pattern is a bias trade (a variant wins exactly where the champion's parameter bias points the other way), shown causally by the fitted-physics rerun."},{"desc":"","entry":18,"id":"assert18a","kind":"claim","text":"v2Edge's trailing max(0,·) descent clamp is dead code: ε(s) keeps every descent edge cost at or above a strictly positive floor."},{"desc":"","entry":18,"id":"assert18a_ev1","kind":"evidence","text":"1.78M-combo synthetic sweep: global min pre-clamp cost +4.1e-4 kJ; middle-regime identity to 1e-12."},{"desc":"","entry":18,"id":"assert18a_ev2","kind":"evidence","text":"Real data: min pre-clamp descent edge +4.6 J across 1402 rides (fitted physics: +3.9 J)."},{"desc":"the Jensen more-credit prediction failed; the resolution effect dominates","entry":18,"id":"assert18b","kind":"claim","text":"Grade-local ε is resolution-sensitive in a way the aggregate is not: R1d (deployed v2Edge) roughly ties the champion at ~30 m sampling and is strictly worse at 5 m."},{"desc":"","entry":19,"id":"assert19","kind":"claim","text":"The resolution over-charge transfers to the deployment: paired signed gap +9.44 pp (censo) and +3.64 pp (pooled riders) — the pre-registered decision rule is TRIGGERED."},{"desc":"","entry":19,"id":"assert19_ev1","kind":"evidence","text":"Both mechanisms measured separately: h₊(igc5) > h₊(igc30) on 919/922 rides; implied drop-weighted ε 0.414@5m vs 0.456@30m."},{"desc":"","entry":19,"id":"assert19b","kind":"claim","text":"FABDEM is unsuitable for energy computation on flat/urban terrain: pooled med|Δ%| 17.6 vs 7.1 (igc30); median h₊ +57% pooled, up to +135% on flat corpora."},{"desc":"","entry":2,"id":"assert2","kind":"claim","text":"Baseline: the canonical forward simulation reproduces measured energy to 5.1% median with no bias; the approximate (climb-aero off) sits +19.2% high on essentially every ride — the uphill aero over-charge isolated as the dominant closed-form error."},{"desc":"","entry":20,"id":"assert20","kind":"claim","text":"PASS: σ* = 10 m + per-rider effective (CdA, Crr, kSmooth) meets med|Δ%| < 5 and |bias| < 2 on all three riders' validation halves; the calibration, not the smoothing, is the lever; fitted values are effective, not physical."},{"desc":"","entry":20,"id":"assert20_ev1","kind":"evidence","text":"Validation: ppaz 3.69/+0.96, jaam 2.74/+0.31, danlessa 4.94/+0.81 (0.06 pp margin)."},{"desc":"","entry":20,"id":"assert20_ev2","kind":"evidence","text":"Ablation: σ=0 calibrated also passes (3.66/2.25/4.95) — post-calibration, smoothing buys ≈ nothing."},{"desc":"H21 partially supported — scope-limited to the terrain regime it was fitted on","entry":21,"id":"assert21","kind":"claim","text":"The behavioural constants are functions of (Δx, terrain-roughness regime), not of Δx alone: the fitted trio (k_s 0.9375, ε₀ 0.0632, climbThr 0.025) bridges the gap per-ride on all three rider corpora but closes only ~55% of censo's gap."},{"desc":"","entry":21,"id":"assert21_ev1","kind":"evidence","text":"E1 bridged on ppaz/jaam/danlessa (Δ ≤ 0.62 / ≤ 1.00 pp); P1, P2, P4 hold — k_s-only fit (0.8844) lands on the median h₊ ratio (0.8958)."},{"desc":"","entry":21,"id":"assert21_ev2","kind":"evidence","text":"P3 fails: censo (never fitted, flattest terrain) not bridged (gap 4.44 pp); E2 gate fails on danlessa by 0.22 pp."},{"desc":"","entry":22,"id":"assert22","kind":"claim","text":"Champion vs canonical is statistical parity: bootstrap 95% CIs [2.0, 5.6] vs [3.8, 7.1] overlap; paired, the champion is closer on 25/44 rides (57%, sign test p = 0.45). Parity is still practically decisive — the closed form is the engine cheap enough to route with."},{"desc":"yes — one-sided bias confirmed; three mitigations shipped as simujaules v57 options","entry":23,"id":"assert23","kind":"claim","text":"Yes — and terrain roughly doubles the pure-geometry prediction: sq8 sits +12.7% median (+47% p90) above a converged near-continuum reference on the deployed 5 m DTM; the mechanism is height oscillation under the asymmetric climb/descent cost, not octile distance. Profile-integrated sq16 recovers ≈⅔ of the bias; NAIVE long-edge costing flips the error's sign (the trap: it flattens the relief it crosses). Pre-registration scorecard against the shipped worker: wall-time confirmed, field-median borderline, budget-reach miscalibrated — pre-register distributions, not point ranges."},{"desc":"","entry":24,"id":"assert24","kind":"claim","text":"The survey brackets our measurements: consumer-baro h₊ error is ~1–5% device-level, DEM per-point accuracy does NOT transfer to accumulated ascent, and the consensus direction is GPS-only under-reads while DEM correction over-reads — Entries 6 and 19 sit inside every located band, and Entry 19's flat-terrain FABDEM failure is sharper than anything located. The decidability point: h₊ has no true value, only a value at a smoothing scale, so geometry alone cannot adjudicate between sources — the measured-energy endpoint turns the smoothing scale into a fittable parameter (Entries 19–21), a validation no located study performs."},{"desc":"","entry":3,"id":"assert3","kind":"claim","text":"The climb-fraction correction roughly halves the over-prediction (+19.2% → +8.5% median, better on 43/44 rides); zeroing climb aero beats charging it at v_c (8.7% vs 12.5% med|Δ%|) — climbs are slow enough that their real aero is closer to zero."},{"desc":"","entry":4,"id":"assert4","kind":"claim","text":"v_f is the second lever after climb aero: sourcing it from the measured flat speed cuts the residual +8.5% → +2.7%; the sheet's 0.60 ratio nulls the bias (−0.5%) but only by over-correcting v_f — the data's flat power is ~94% of average power, not 60%."},{"desc":"champion recipe found: cf + 2 m deadband; denoise h₊ for the approximate only","entry":5,"id":"assert5","kind":"claim","text":"The approximate's entire error is a climb story (+26.7% climb regime vs ±4% flat); ~20% of raw h₊ is sub-3 m jitter, accounting for ~93% of the climb over-prediction; a 2 m deadband takes cf to 3.4% med|Δ%| — beating the raw canonical (5.1%) — while smoothing mildly HURTS the canonical, which is nearly immune to ascent noise but sensitive to regime reclassification."},{"desc":"","entry":6,"id":"assert6","kind":"claim","text":"No single source is ground truth for ascent — they bracket it: the recorded baro under-reads (−11% raw / −21% smoothed vs the IGC 5 m DTM), the DSMs over-read (COP30 +18%, SRTM +34%), FABDEM lands +6%; nearest-neighbour sampling adds ~30 pp of staircase (use bilinear); the geometric k_DEM correction is the solid result, while the energy k_h (~0.8–0.9 estimated) stayed an open TODO."},{"desc":"","entry":7,"id":"assert7","kind":"claim","text":"On sustained climbs k_h ≈ 0.96–1: the rider pays the full mg·Δh, so there is no uniform climbing discount; sustained climbing is only 54% of total ascent — the discount lives in rollers and noise — so the right correction is the per-profile deadband, not a scalar (cross-check: cf + 2 m deadband 3.6% vs canonical 5.1% vs scalar k_smooth 5.8%)."},{"desc":"","entry":8,"id":"assert8","kind":"claim","text":"ε is predictable from grade alone on real descents: ε ≈ clamp01(min(1, (α/β)/s̄) − 0.13), the −0.13 a near-constant offset for residual descent pedalling/braking; the remaining scatter is rider behaviour, not route geometry."},{"desc":"","entry":8,"id":"assert8_ev1","kind":"evidence","text":"At s̄ ≥ 3% the calibrated estimator reaches RMS 0.08 vs a flat-median baseline 0.13 — a 37% RMS reduction (Entry 11's honest statistic); worked example RMC200 Mogi: predicted 0.46 vs measured 0.47."},{"desc":"","entry":8,"id":"assert8_ev2","kind":"evidence","text":"The flat→ε→1 intuition is reversed (gentle rides are pedalled through dips, measured ε→0), curve/off-road penalties fit with the wrong sign, and over all 44 rides the estimator loses to the flat median — restrict to real descents."},{"desc":"","entry":9,"id":"assert9","kind":"claim","text":"All three models reproduce measured energy to ~4–7% median with a generic assumed rider (poor-man's ε=0.20 best at 3.9%); ε_geom over-credits descent recovery on stop-go riding — the braking penalty the open rural rides could not isolate — giving the corpus rule: ε_geom on open coastable routes, flat ε ≈ 0.20 on urban stop-go; a physical-plausibility floor excluded 7 rides whose energy deficit is a power-channel problem, not walking."},{"desc":"","entry":null,"id":"bootstrap_ci.py","kind":"artifact","text":"bootstrap_ci.py"},{"desc":"","entry":null,"id":"build_model_inputs.py","kind":"artifact","text":"build_model_inputs.py"},{"desc":"","entry":null,"id":"cda_estimate.csv","kind":"artifact","text":"gitignored; regenerates via `python3 harness/cda_estimate.py`"},{"desc":"","entry":null,"id":"cda_estimate.py","kind":"artifact","text":"cda_estimate.py"},{"desc":"","entry":null,"id":"censo_compare.py","kind":"artifact","text":"censo_compare.py"},{"desc":"","entry":null,"id":"censo_comparison.csv","kind":"artifact","text":"gitignored; regenerates via `python3 harness/censo_compare.py`"},{"desc":"","entry":null,"id":"compare.py","kind":"artifact","text":"compare.py"},{"desc":"","entry":null,"id":"danlessa_compare.py","kind":"artifact","text":"danlessa_compare.py"},{"desc":"","entry":null,"id":"danlessa_comparison.csv","kind":"artifact","text":"gitignored; regenerates via `python3 harness/danlessa_compare.py`"},{"desc":"","entry":null,"id":"dem_comparison_doc","kind":"artifact","text":"dem-elevation-comparison.md"},{"desc":"","entry":18,"id":"entry18","kind":"artifact","text":"Corrects Entry 17's attribution: R1a (frozen-ε per edge) is NOT the deployed sampasimu cost."},{"desc":"","entry":null,"id":"eps_hypothesis.csv","kind":"artifact","text":"gitignored; regenerates via `python3 harness/eps_hypothesis.py`"},{"desc":"","entry":null,"id":"eps_hypothesis.py","kind":"artifact","text":"eps_hypothesis.py"},{"desc":"","entry":null,"id":"eps_sp.csv","kind":"artifact","text":"gitignored; regenerates via `python3 harness/eps_sp_test.py`"},{"desc":"","entry":null,"id":"eps_sp_test.py","kind":"artifact","text":"eps_sp_test.py"},{"desc":"","entry":null,"id":"goal_calibration.csv","kind":"artifact","text":"gitignored; regenerates via `python3 goal_calibration.py`"},{"desc":"","entry":null,"id":"goal_calibration.py","kind":"artifact","text":"goal_calibration.py"},{"desc":"","entry":null,"id":"grid_sens_note","kind":"artifact","text":"grid-connectivity-sensitivity-2026-07-11.md"},{"desc":"","entry":21,"id":"h21","kind":"hypothesis","text":"A single rider-independent re-calibration of the behavioural trio (k_s, ε₀, climbThr) at Δx = 5 m bridges the gap, with each constant moving as its mechanism predicts."},{"desc":"","entry":10,"id":"hyp10","kind":"hypothesis","text":"Urban stop-go suppresses descent recovery below the free-coasting closed form: ε_SP = clamp(ε_coast − Δε_brake), with Δε_brake read from forced decelerations in the speed trace."},{"desc":"","entry":null,"id":"igc_resolution_test.csv","kind":"artifact","text":"gitignored; regenerates via `python3 igc_resolution_test.py`"},{"desc":"","entry":null,"id":"igc_resolution_test.py","kind":"artifact","text":"igc_resolution_test.py"},{"desc":"","entry":null,"id":"jaam_compare.py","kind":"artifact","text":"jaam_compare.py"},{"desc":"","entry":null,"id":"jaam_comparison.csv","kind":"artifact","text":"gitignored; regenerates via `python3 harness/jaam_compare.py`"},{"desc":"","entry":null,"id":"journal","kind":"artifact","text":"Model comparison journal"},{"desc":"","entry":null,"id":"model_comparison.csv","kind":"artifact","text":"gitignored; regenerates via `python3 harness/compare.py` (44 longões)"},{"desc":"","entry":null,"id":"param_fit.csv","kind":"artifact","text":"gitignored; regenerates via `python3 harness/param_fit.py`"},{"desc":"","entry":null,"id":"param_fit.py","kind":"artifact","text":"param_fit.py"},{"desc":"","entry":19,"id":"plan19","kind":"plan","text":"Paired v2Edge@igc5 vs @igc30 on 922 rides; decision rule: signed-bias gap > ~3–4 pp puts static ~30 m pre-smoothing on the roadmap."},{"desc":"","entry":20,"id":"plan20","kind":"plan","text":"Deterministic 50/50 hash split per rider; lever 1 = deployable Gaussian pre-smoothing σ ∈ {0,10,15,20,30,45} selected on train; lever 2 = per-rider (CdA, Crr, kSmooth) fitted on train; validation evaluated ONCE at frozen settings; pre-declared fallback ladder."},{"desc":"","entry":21,"id":"plan21","kind":"plan","text":"Two-stage: the trio is fitted purely as a 5m→30m resolution transfer (measured energies never touched in stage 1); stage 2 evaluates accuracy once on validation; censo held out entirely as an out-of-sample transfer corpus; four coherence predictions P1–P4."},{"desc":"","entry":null,"id":"ppaz_compare.py","kind":"artifact","text":"ppaz_compare.py"},{"desc":"","entry":null,"id":"ppaz_comparison.csv","kind":"artifact","text":"gitignored; regenerates via `python3 harness/ppaz_compare.py`"},{"desc":"","entry":10,"id":"q10","kind":"question","text":"Is São Paulo's ε a braking-driven quantity, predictable from stop-go density?"},{"desc":"","entry":12,"id":"q12","kind":"question","text":"Does anything transfer to a second, fully-independent rider (P. Paz, different body, meter and riding profile)?"},{"desc":"","entry":13,"id":"q13","kind":"question","text":"Does the time model t = x*/v_f, x* = x + k₊·h₊ − k₋·h₋ predict measured moving time?"},{"desc":"","entry":14,"id":"q14","kind":"question","text":"Does a third fully-independent rider (JAAM) confirm the ε transfer?"},{"desc":"","entry":15,"id":"q15","kind":"question","text":"Can CdA, C_rr, mass and per-activity wind be independently estimated from uncontrolled ride data, within plausible ranges, for every dataset?"},{"desc":"","entry":16,"id":"q16","kind":"question","text":"Do the conclusions hold under the Entry-15 FITTED rider physics — and on the author's full 1597-ride export?"},{"desc":"","entry":17,"id":"q17","kind":"question","text":"Does a regime-decomposed closed form E_flat + E_climb + E_descent beat the champion?"},{"desc":"","entry":19,"id":"q19","kind":"question","text":"Most of the time we use the IGC-SP DTM at 5 m resolution — is this a concern?"},{"desc":"","entry":2,"id":"q2","kind":"question","text":"Out of the box, how close do the two models land on the 44 longões power rides?"},{"desc":"","entry":20,"id":"q20","kind":"question","text":"Can the deployed pipeline reach prediction error < ±5% with bias < ±2%?"},{"desc":"","entry":21,"id":"q21","kind":"question","text":"Can the resolution gap be bridged through parameters on the closed form rather than editing the DEM?"},{"desc":"","entry":23,"id":"q23","kind":"question","text":"Does the 8-connected move grid make simujaules terrain mode overestimate optimal energy via route jaggedness?"},{"desc":"","entry":24,"id":"q24","kind":"question","text":"What does the literature say a cumulative-ascent measurement is worth (consumer barometers, FABDEM, aerophotogrammetric DEMs) — and how do our entries compare?"},{"desc":"","entry":3,"id":"q3","kind":"question","text":"How does the approximate behave if the climb-fraction correction is folded into α?"},{"desc":"","entry":4,"id":"q4","kind":"question","text":"Can the sheet's P_flat/P_avg column be taken into account?"},{"desc":"","entry":5,"id":"q5","kind":"question","text":"Where does the remaining error live per regime, how much is elevation noise in h₊, and does a smoothing filter help?"},{"desc":"","entry":6,"id":"q6","kind":"question","text":"How does elevation from FABDEM/SRTM/COP30 differ from the recorded barometric track, and what is k_h for DEM-derived h₊/h₋?"},{"desc":"","entry":7,"id":"q7","kind":"question","text":"What is k_h fitted on sustained ascent sections (mean slope > 3% over > 100 m)?"},{"desc":"","entry":8,"id":"q8","kind":"question","text":"Is there a closed form for ε from each activity's route geometry alone?"},{"desc":"","entry":9,"id":"q9","kind":"question","text":"How do canonical / smooth-approximate / poor-man's fare on the collective's own urban stop-go rides, with an assumed generic rider?"},{"desc":"","entry":null,"id":"regime_compare.py","kind":"artifact","text":"regime_compare.py"},{"desc":"","entry":null,"id":"regime_comparison.csv","kind":"artifact","text":"gitignored; regenerates via `python3 regime_compare.py`"},{"desc":"","entry":10,"id":"run10","kind":"run","text":""},{"desc":"","entry":12,"id":"run12","kind":"run","text":""},{"desc":"","entry":13,"id":"run13","kind":"run","text":""},{"desc":"","entry":14,"id":"run14","kind":"run","text":""},{"desc":"","entry":15,"id":"run15","kind":"run","text":""},{"desc":"","entry":16,"id":"run16","kind":"run","text":""},{"desc":"","entry":17,"id":"run17","kind":"run","text":""},{"desc":"","entry":19,"id":"run19","kind":"run","text":""},{"desc":"","entry":2,"id":"run2","kind":"run","text":""},{"desc":"","entry":20,"id":"run20","kind":"run","text":""},{"desc":"","entry":21,"id":"run21","kind":"run","text":""},{"desc":"","entry":22,"id":"run22","kind":"run","text":""},{"desc":"","entry":23,"id":"run23","kind":"run","text":"Executed in the sibling simujaules repo (grid-sens.mjs and companion harnesses; self-validates bit-identical against the deployed energy-worker.js on every run); imported here."},{"desc":"","entry":3,"id":"run3","kind":"run","text":""},{"desc":"","entry":4,"id":"run4","kind":"run","text":""},{"desc":"","entry":5,"id":"run5","kind":"run","text":""},{"desc":"","entry":6,"id":"run6","kind":"run","text":""},{"desc":"","entry":7,"id":"run7","kind":"run","text":""},{"desc":"","entry":8,"id":"run8","kind":"run","text":""},{"desc":"","entry":9,"id":"run9","kind":"run","text":""},{"desc":"","entry":null,"id":"scale_trio.csv","kind":"artifact","text":"gitignored; regenerates via `python3 scale_trio.py`"},{"desc":"","entry":null,"id":"scale_trio.py","kind":"artifact","text":"scale_trio.py"},{"desc":"","entry":null,"id":"time_compare.py","kind":"artifact","text":"time_compare.py"},{"desc":"","entry":null,"id":"time_comparison.csv","kind":"artifact","text":"gitignored; regenerates via `python3 harness/time_compare.py`"},{"desc":"","entry":null,"id":"verify_v2edge_clamp.py","kind":"artifact","text":"verify_v2edge_clamp.py"}]};

/* ── model ── */
const KINDS = {
  question:  {c:"--c-question", pt:"pergunta",  shape:"ring",     r:11},
  claim:     {c:"--c-claim",    pt:"afirmação", shape:"circle",   r:12},
  hypothesis:{c:"--c-claim",    pt:"hipótese",  shape:"diamond",  r:11},
  evidence:  {c:"--c-claim",    pt:"evidência", shape:"dot",      r:6},
  run:       {c:"--c-process",  pt:"execução",  shape:"triangle", r:9},
  plan:      {c:"--c-process",  pt:"protocolo", shape:"square",   r:9},
  artifact:  {c:"--c-artifact", pt:"artefato",  shape:"rect",     r:8},
};
const EDGE_PT = {sup:"sustenta", dis:"contesta", meta:"cita (corrige/atualiza/qualifica/estende)",
  cites:"cita como evidência", about:"sobre", prov:"proveniência", ref:"referência"};

/* deterministic PRNG so the initial layout is stable */
let seed = 42;
function rand(){ seed=(seed+0x6D2B79F5)|0; let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }

const nodes = DATA.nodes.map(n => ({...n,
  x:(rand()-0.5)*900, y:(rand()-0.5)*700, vx:0, vy:0}));
const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));
const links = DATA.links.map(l => ({...l, a:byId[l.s], b:byId[l.t]}));
nodes.forEach(n => { n.deg = 0; });
links.forEach(l => { l.a.deg++; l.b.deg++; });

/* ── layered layout (default): columns = journal entries, lanes = node kind ── */
const COL = 150;
const LANES = {question:-300, hypothesis:-210, claim:-120, evidence:-20,
  run:70, plan:150};
const LANE_PT = [["perguntas",-300],["hipóteses",-210],["afirmações",-120],
  ["evidências",-20],["execuções",70],["protocolos",150],["artefatos",300]];
function layeredLayout(){
  const groups = {};
  for(const n of nodes){
    if(n.entry==null || !(n.kind in LANES)) continue;
    (groups[n.entry+"|"+n.kind] = groups[n.entry+"|"+n.kind]||[]).push(n);
  }
  for(const key in groups){
    const [e] = key.split("|");
    const arr = groups[key].sort((a,b)=>a.id<b.id?-1:1);
    arr.forEach((n,i)=>{
      n.x = (e-12.5)*COL + (i%2 ? 26 : 0);
      n.y = LANES[n.kind] + i*34 - (arr.length-1)*17;
      n.vx=n.vy=0;
    });
  }
  const rest = nodes.filter(n=>n.entry==null || !(n.kind in LANES));
  for(const n of rest){
    const nb=[];
    for(const l of links){
      if(l.a===n && l.b.entry!=null) nb.push((l.b.entry-12.5)*COL);
      if(l.b===n && l.a.entry!=null) nb.push((l.a.entry-12.5)*COL);
    }
    n._cx = nb.length ? nb.reduce((s,v)=>s+v,0)/nb.length : 0;
  }
  rest.sort((a,b)=>a._cx-b._cx || (a.id<b.id?-1:1));
  rest.forEach((n,i)=>{
    n.x = (rest.length>1 ? (i/(rest.length-1)-0.5) : 0) * 23.5*COL;
    n.y = 260 + (i%3)*75;
    n.vx=n.vy=0;
  });
}

/* ── state ── */
const active = Object.fromEntries(Object.keys(KINDS).map(k=>[k,true]));
let query = "", selected = null, hovered = null, mode = "layers";
let panX = 0, panY = 0, zoom = 1, needsDraw = true;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function visible(n){ return active[n.kind] && n; }
function matches(n){ if(!query) return true;
  return (n.id + " " + n.text + " " + n.desc).toLowerCase().includes(query); }

/* ── simulation ── */
function tick(){
  const GRAV = 0.002, REP = 1300, LINK = 0.14, LEN = 65, VCAP = 5;
  for(let i=0;i<nodes.length;i++){
    const a = nodes[i]; if(!active[a.kind]) continue;
    a.vx -= a.x*GRAV; a.vy -= a.y*GRAV;
    for(let j=i+1;j<nodes.length;j++){
      const b = nodes[j]; if(!active[b.kind]) continue;
      let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy+150;
      const f = REP/d2;
      dx*=f; dy*=f; a.vx+=dx; a.vy+=dy; b.vx-=dx; b.vy-=dy;
    }
  }
  for(const l of links){
    if(!active[l.a.kind]||!active[l.b.kind]) continue;
    const dx=l.b.x-l.a.x, dy=l.b.y-l.a.y, d=Math.sqrt(dx*dx+dy*dy)||1;
    const f = LINK*(d-LEN)/d;
    l.a.vx+=dx*f; l.a.vy+=dy*f; l.b.vx-=dx*f; l.b.vy-=dy*f;
  }
  for(const n of nodes){
    if(n===dragNode) { n.vx=0; n.vy=0; continue; }
    n.vx*=0.85; n.vy*=0.85;
    const v = Math.sqrt(n.vx*n.vx+n.vy*n.vy);
    if(v>VCAP){ n.vx*=VCAP/v; n.vy*=VCAP/v; }
    n.x+=n.vx; n.y+=n.vy;
  }
}

function fitView(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,count=0;
  for(const n of nodes){ if(!active[n.kind]) continue; count++;
    x0=Math.min(x0,n.x); y0=Math.min(y0,n.y);
    x1=Math.max(x1,n.x); y1=Math.max(y1,n.y); }
  if(!count||!W||!H) return;
  zoom = Math.min(1.5, Math.max(0.15,
    0.88*Math.min(W/(x1-x0+120), H/(y1-y0+120))));
  panX = -zoom*(x0+x1)/2; panY = -zoom*(y0+y1)/2;
}

/* ── rendering ── */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let W=0, H=0, DPR = devicePixelRatio||1;
const graphBox = document.getElementById("graph");
function resize(){
  const r = graphBox.getBoundingClientRect();
  W=r.width; H=r.height;
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  needsDraw=true;
}
new ResizeObserver(resize).observe(graphBox);

function css(v){ return getComputedStyle(document.documentElement)
  .getPropertyValue(v).trim(); }

function shapePath(shape, r){
  ctx.beginPath();
  if(shape==="circle"||shape==="dot"||shape==="ring") ctx.arc(0,0,r,0,7);
  else if(shape==="diamond"){ ctx.moveTo(0,-r*1.25); ctx.lineTo(r*1.25,0);
    ctx.lineTo(0,r*1.25); ctx.lineTo(-r*1.25,0); ctx.closePath(); }
  else if(shape==="triangle"){ ctx.moveTo(0,-r*1.25); ctx.lineTo(r*1.15,r*0.9);
    ctx.lineTo(-r*1.15,r*0.9); ctx.closePath(); }
  else if(shape==="square") ctx.rect(-r,-r,2*r,2*r);
  else ctx.rect(-r*1.2,-r*0.8,2.4*r,1.6*r);
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.translate(W/2+panX, H/2+panY); ctx.scale(zoom,zoom);
  const ink=css("--ink"), muted=css("--muted"), paper=css("--paper");
  if(mode==="layers"){
    ctx.globalAlpha=0.8; ctx.fillStyle=muted; ctx.textAlign="center";
    ctx.font=`600 ${13/zoom}px -apple-system, sans-serif`;
    for(let e=1;e<=24;e++) ctx.fillText("E"+e, (e-12.5)*COL, -370);
    ctx.textAlign="right";
    ctx.font=`${12/zoom}px -apple-system, sans-serif`;
    for(const [t,y] of LANE_PT) ctx.fillText(t, -12.4*COL, y+4);
    ctx.globalAlpha=1;
  }
  const neighbors = new Set();
  const focus = selected||hovered;
  if(focus){ neighbors.add(focus.id);
    links.forEach(l=>{ if(l.a===focus) neighbors.add(l.b.id);
      if(l.b===focus) neighbors.add(l.a.id); }); }

  for(const l of links){
    if(!active[l.a.kind]||!active[l.b.kind]) continue;
    const dim = focus && !(l.a===focus||l.b===focus);
    ctx.globalAlpha = dim ? 0.08 : (l.g==="prov"||l.g==="ref" ? 0.3 : 0.55);
    ctx.strokeStyle = muted;
    ctx.lineWidth = (l.g==="sup"||l.g==="dis" ? 1.8 : 0.9)/zoom;
    ctx.setLineDash(l.g==="dis" ? [5/zoom,4/zoom]
      : l.g==="meta" ? [2/zoom,3/zoom] : []);
    ctx.beginPath(); ctx.moveTo(l.a.x,l.a.y); ctx.lineTo(l.b.x,l.b.y);
    ctx.stroke();
    /* arrowhead */
    if(!dim && zoom>0.5 && l.g!=="ref"){
      const dx=l.b.x-l.a.x, dy=l.b.y-l.a.y, d=Math.sqrt(dx*dx+dy*dy)||1;
      const rr = KINDS[l.b.kind].r+4, px=l.b.x-dx/d*rr, py=l.b.y-dy/d*rr;
      const s=4/zoom;
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(px,py);
      ctx.lineTo(px-dx/d*s*2+dy/d*s, py-dy/d*s*2-dx/d*s);
      ctx.lineTo(px-dx/d*s*2-dy/d*s, py-dy/d*s*2+dx/d*s);
      ctx.closePath(); ctx.fillStyle=muted; ctx.fill();
    }
  }
  ctx.setLineDash([]);

  for(const n of nodes){
    if(!active[n.kind]) continue;
    const k = KINDS[n.kind];
    const dimF = focus && !neighbors.has(n.id);
    const dimQ = query && !matches(n);
    ctx.globalAlpha = (dimF||dimQ) ? 0.15 : 1;
    ctx.save(); ctx.translate(n.x,n.y);
    const col = css(k.c);
    const r = k.r + Math.min(4, n.deg*0.25);
    shapePath(k.shape, r);
    if(k.shape==="ring"){ ctx.lineWidth=3; ctx.strokeStyle=col;
      ctx.fillStyle=paper; ctx.fill(); ctx.stroke(); }
    else { ctx.fillStyle=col; ctx.fill();
      ctx.lineWidth=1.5; ctx.strokeStyle=paper; ctx.stroke(); }
    if(n===selected){ shapePath(k.shape, r+4/zoom);
      ctx.lineWidth=1.5/zoom; ctx.strokeStyle=ink; ctx.stroke(); }
    if(zoom>0.3 && (n.kind!=="evidence"||focus) && !(dimF||dimQ)){
      ctx.font = `${11/zoom}px -apple-system, sans-serif`;
      ctx.fillStyle = ink; ctx.textAlign="center";
      ctx.fillText(n.id, 0, r+13/zoom);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ── main loop ── */
let cooling = 0;
let userMovedView = false;
function frame(){
  if(mode==="force" && cooling>0){ tick(); cooling--; needsDraw=true;
    if(!userMovedView && (cooling%20===0)) fitView(); }
  if(needsDraw){ draw(); needsDraw=false; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function reheat(n){
  if(mode!=="force"){ needsDraw=true; return; }
  if(reduced){ for(let i=0;i<200;i++) tick(); needsDraw=true; return; }
  cooling = Math.max(cooling, n); needsDraw=true;
}
function setMode(m){
  mode=m; userMovedView=false;
  if(m==="layers"){ cooling=0; layeredLayout(); }
  else if(reduced){ for(let i=0;i<600;i++) tick(); }
  else cooling=600;
  fitView(); needsDraw=true;
}

/* ── interaction ── */
let dragNode=null, panning=false, lastX=0, lastY=0, moved=false;
function toWorld(ev){
  const r=canvas.getBoundingClientRect();
  return [(ev.clientX-r.left-W/2-panX)/zoom, (ev.clientY-r.top-H/2-panY)/zoom];
}
function pick(ev){
  const [x,y]=toWorld(ev);
  let best=null, bd=1e9;
  for(const n of nodes){
    if(!active[n.kind]) continue;
    const r=KINDS[n.kind].r+6, d=(n.x-x)**2+(n.y-y)**2;
    if(d<r*r && d<bd){ best=n; bd=d; }
  }
  return best;
}
canvas.addEventListener("pointerdown", ev=>{
  canvas.setPointerCapture(ev.pointerId);
  moved=false; lastX=ev.clientX; lastY=ev.clientY;
  dragNode=pick(ev); panning=!dragNode;
  canvas.style.cursor = dragNode? "grabbing":"grab";
});
canvas.addEventListener("pointermove", ev=>{
  const tip=document.getElementById("tip");
  if(dragNode){
    const [x,y]=toWorld(ev); dragNode.x=x; dragNode.y=y; moved=true;
    reheat(120); return;
  }
  if(panning && ev.buttons){
    panX+=ev.clientX-lastX; panY+=ev.clientY-lastY;
    lastX=ev.clientX; lastY=ev.clientY; moved=true; userMovedView=true;
    needsDraw=true; return;
  }
  const n=pick(ev);
  if(n!==hovered){ hovered=n; needsDraw=true; }
  if(n){
    tip.style.display="block";
    tip.style.left=Math.min(innerWidth-360, ev.clientX+14)+"px";
    tip.style.top=(ev.clientY+14)+"px";
    tip.innerHTML=`<span class="id">${n.id}</span> · ${KINDS[n.kind].pt}`+
      (n.text?`<br><span class="t">${esc(n.text.slice(0,160))}${n.text.length>160?"…":""}</span>`:"");
  } else tip.style.display="none";
});
canvas.addEventListener("pointerup", ev=>{
  if(!moved){ const n=pick(ev); select(n); }
  dragNode=null; panning=false; canvas.style.cursor="grab";
});
canvas.addEventListener("wheel", ev=>{
  ev.preventDefault();
  const f = Math.exp(-ev.deltaY*0.0012);
  const r=canvas.getBoundingClientRect();
  const mx=ev.clientX-r.left-W/2, my=ev.clientY-r.top-H/2;
  panX = mx-(mx-panX)*f; panY = my-(my-panY)*f;
  zoom*=f; zoom=Math.min(4,Math.max(0.15,zoom)); userMovedView=true;
  needsDraw=true;
},{passive:false});

function esc(s){ const d=document.createElement("i"); d.textContent=s;
  return d.innerHTML; }

/* ── sidebar ── */
function select(n){
  selected=n; needsDraw=true;
  const side=document.getElementById("side");
  if(!n){ side.classList.remove("open"); side.innerHTML=""; return; }
  const rel=[];
  for(const l of links){
    if(l.a===n) rel.push(`→ ${EDGE_PT[l.g]} (<code>${l.p}</code>) <button class="nav" data-id="${l.b.id}">${l.b.id}</button>`);
    if(l.b===n) rel.push(`← ${EDGE_PT[l.g]} (<code>${l.p}</code>) <button class="nav" data-id="${l.a.id}">${l.a.id}</button>`);
  }
  const crate = n.entry ? `<p><a href="../packages/entry${String(n.entry).padStart(2,"0")}/ro-crate-preview.html">pacote de evidência da entrada ${n.entry}</a></p>` : "";
  side.innerHTML = `<button class="close" aria-label="Fechar">fechar ✕</button>
    <div class="kind">${KINDS[n.kind].pt}${n.entry?` · entrada ${n.entry}`:""}</div>
    <h2>${esc(n.id)}</h2>
    ${n.text?`<p>${esc(n.text)}</p>`:""}
    ${n.desc?`<p class="desc">${esc(n.desc)}</p>`:""}
    ${crate}
    <h3>Relações (${rel.length})</h3>
    <ul>${rel.map(r=>`<li>${r}</li>`).join("")}</ul>`;
  side.classList.add("open");
  side.querySelector(".close").onclick=()=>select(null);
  side.querySelectorAll("button.nav").forEach(b=>{
    b.onclick=()=>{ const m=byId[b.dataset.id]; select(m);
      panX=-m.x*zoom; panY=-m.y*zoom; needsDraw=true; };
  });
}

/* ── controls ── */
const legend=document.getElementById("legend");
for(const [k,v] of Object.entries(KINDS)){
  const lab=document.createElement("label");
  lab.innerHTML=`<input type="checkbox" checked>
    <span class="sw" style="background:var(${v.c});
    ${v.shape==="ring"?"background:transparent;border:2.5px solid var("+v.c+");":""}
    ${v.shape==="diamond"?"transform:rotate(45deg);border-radius:2px;":""}
    ${v.shape==="square"||v.shape==="rect"?"border-radius:2px;":""}
    ${v.shape==="dot"?"width:.5rem;height:.5rem;":""}"></span>${v.pt}`;
  lab.querySelector("input").addEventListener("change",ev=>{
    active[k]=ev.target.checked; reheat(200);
    if(selected&&!active[selected.kind]) select(null);
  });
  legend.appendChild(lab);
}
document.getElementById("edgeLegend").textContent =
  "arestas: sólida grossa = sustenta · tracejada = contesta · " +
  "pontilhada = corrige/atualiza/qualifica · fina = proveniência/sobre";
document.getElementById("q").addEventListener("input",ev=>{
  query=ev.target.value.trim().toLowerCase(); needsDraw=true;
});
document.querySelectorAll('#modeSwitch input').forEach(r=>{
  r.addEventListener("change",()=>setMode(r.value));
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",
  ()=>{ needsDraw=true; });
layeredLayout();
resize();
fitView();
</script>
</body>
</html>
